<!DOCTYPE html>
<html>
<head>
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #222; /* Dark background for contrast */
        }

        .pet-style {
            position: absolute;
            width: 64px; /* Adjusted for your sprite size */
            height: 64px;
            image-rendering: pixelated;
            transform: scale(2);
            transform-origin: top left;
            cursor: pointer;
            transition: filter 0.2s;
        }

        /* Sprite Sheet Assignments */
        .girl { background-image: url('gina-walk.jpg'); background-size: 256px 256px; }
        .boy  { background-image: url('vince-walk.jpg'); background-size: 256px 256px; }

        /* Idle State - Uses your high-res static images */
        .idle.girl { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_1.jpg'); background-size: contain; background-position: center; }
        .idle.boy  { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_2.jpg'); background-size: contain; background-position: center; }

        .selected {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
            z-index: 100;
        }

        /* Walking Animation */
        .walking { animation: walk-cycle 0.8s steps(4) infinite; }
        @keyframes walk-cycle { 
            from { background-position-x: 0px; } 
            to { background-position-x: -256px; } 
        }

        /* Directional Rows based on your 4x4 sheet */
        .face-down  { background-position-y: 0px; }
        .face-left  { background-position-y: -64px; }
        .face-up    { background-position-y: -128px; }
        .face-right { background-position-y: -192px; }
    </style>
</head>
<body>
    <div id="pet1" class="pet-style girl face-down selected idle"></div>
    <div id="pet2" class="pet-style boy face-down idle"></div>

    <script>
        const walkSpeed = 3;
        const petRadius = 40;
        let selectedIndex = 0;

        const pets = [
            {
                el: document.getElementById('pet1'),
                pos: { x: 100, y: 150 },
                target: { x: 100, y: 150 }
            },
            {
                el: document.getElementById('pet2'),
                pos: { x: 400, y: 150 },
                target: { x: 400, y: 150 }
            }
        ];

        // Selection Toggle
        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                selectedIndex = (selectedIndex === 0) ? 1 : 0;
                pets.forEach((p, i) => i === selectedIndex ? p.el.classList.add('selected') : p.el.classList.remove('selected'));
            }
        });

        // Click to move selected
        window.addEventListener('click', (e) => {
            const activePet = pets[selectedIndex];
            activePet.target.x = e.clientX - 32;
            activePet.target.y = e.clientY - 32;
        });

        function update() {
            pets.forEach(p => {
                const dx = p.target.x - p.pos.x;
                const dy = p.target.y - p.pos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > walkSpeed) {
                    p.el.classList.remove('idle');
                    p.el.classList.add('walking');
                    
                    // Directional Logic
                    p.el.classList.remove('face-up', 'face-down', 'face-left', 'face-right');
                    if (Math.abs(dx) > Math.abs(dy)) {
                        p.el.classList.add(dx > 0 ? 'face-right' : 'face-left');
                    } else {
                        p.el.classList.add(dy > 0 ? 'face-down' : 'face-up');
                    }

                    p.pos.x += (dx / distance) * walkSpeed;
                    p.pos.y += (dy / distance) * walkSpeed;
                } else {
                    p.el.classList.remove('walking');
                    p.el.classList.add('idle'); // Switch to your provided idle image
                }

                p.el.style.left = p.pos.x + "px";
                p.el.style.top = p.pos.y + "px";
            });

            // Keep them from overlapping
            const p1 = pets[0], p2 = pets[1];
            const distDx = p2.pos.x - p1.pos.x;
            const distDy = p2.pos.y - p1.pos.y;
            const dist = Math.sqrt(distDx * distDx + distDy * distDy) || 0.1;
            if (dist < petRadius * 2) {
                const overlap = (petRadius * 2) - dist;
                p1.pos.x -= (distDx / dist) * (overlap / 2);
                p1.pos.y -= (distDy / dist) * (overlap / 2);
                p2.pos.x += (distDx / dist) * (overlap / 2);
                p2.pos.y += (distDy / dist) * (overlap / 2);
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
