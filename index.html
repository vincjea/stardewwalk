<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sprite Walkers</title>
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #333; 
        }

        .pet-style {
            position: absolute;
            width: 250px;  /* Size of one sprite in your 1000px grid */
            height: 250px;
            image-rendering: pixelated;
            transform: scale(0.5); /* Scale down if they are too big */
            transform-origin: top left;
            cursor: pointer;
            transition: filter 0.2s;
        }

        /* CRITICAL: Ensure these filenames match your GitHub files exactly! 
        */
        .girl { background-image: url('gina-walk.jpg'); background-size: 1000px 1000px; }
        .boy  { background-image: url('vince-walk.jpg'); background-size: 1000px 1000px; }

        /* Idle Animations - Uses the full portrait images */
        .idle.girl { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_1.jpg'); background-size: contain; background-position: center; background-repeat: no-repeat; }
        .idle.boy  { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_2.jpg'); background-size: contain; background-position: center; background-repeat: no-repeat; }

        .selected {
            filter: drop-shadow(0 0 10px #fff);
            z-index: 100;
        }

        /* Walking Animation: 4 steps across the 1000px width */
        .walking { animation: walk-cycle 0.8s steps(4) infinite; }
        @keyframes walk-cycle { 
            from { background-position-x: 0px; } 
            to { background-position-x: -1000px; } 
        }

        /* Directional Rows (Top to Bottom: Down, Left, Up, Right) */
        .face-down  { background-position-y: 0px; }
        .face-left  { background-position-y: -250px; }
        .face-up    { background-position-y: -500px; }
        .face-right { background-position-y: -750px; }
    </style>
</head>
<body>
    <div id="pet1" class="pet-style girl face-down selected idle"></div>
    <div id="pet2" class="pet-style boy face-down idle"></div>

    <script>
        const walkSpeed = 4;
        const petRadius = 60;
        let selectedIndex = 0;

        const pets = [
            { el: document.getElementById('pet1'), pos: { x: 100, y: 150 }, target: { x: 100, y: 150 } },
            { el: document.getElementById('pet2'), pos: { x: 400, y: 150 }, target: { x: 400, y: 150 } }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                selectedIndex = (selectedIndex === 0) ? 1 : 0;
                pets.forEach((p, i) => i === selectedIndex ? p.el.classList.add('selected') : p.el.classList.remove('selected'));
            }
        });

        window.addEventListener('click', (e) => {
            const activePet = pets[selectedIndex];
            activePet.target.x = e.clientX - 60;
            activePet.target.y = e.clientY - 60;
        });

        function update() {
            pets.forEach(p => {
                const dx = p.target.x - p.pos.x;
                const dy = p.target.y - p.pos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > walkSpeed) {
                    p.el.classList.remove('idle');
                    p.el.classList.add('walking');
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        p.el.classList.remove('face-up', 'face-down', 'face-left', 'face-right');
                        p.el.classList.add(dx > 0 ? 'face-right' : 'face-left');
                    } else {
                        p.el.classList.remove('face-up', 'face-down', 'face-left', 'face-right');
                        p.el.classList.add(dy > 0 ? 'face-down' : 'face-up');
                    }

                    p.pos.x += (dx / distance) * walkSpeed;
                    p.pos.y += (dy / distance) * walkSpeed;
                } else {
                    p.el.classList.remove('walking');
                    p.el.classList.add('idle');
                }

                p.el.style.left = p.pos.x + "px";
                p.el.style.top = p.pos.y + "px";
            });

            // Avoid overlap
            const p1 = pets[0], p2 = pets[1];
            const distDx = p2.pos.x - p1.pos.x;
            const distDy = p2.pos.y - p1.pos.y;
            const dist = Math.sqrt(distDx * distDx + distDy * distDy) || 0.1;
            if (dist < petRadius * 2) {
                const overlap = (petRadius * 2) - dist;
                p1.pos.x -= (distDx / dist) * (overlap / 2);
                p1.pos.y -= (distDy / dist) * (overlap / 2);
                p2.pos.x += (distDx / dist) * (overlap / 2);
                p2.pos.y += (distDy / dist) * (overlap / 2);
            }

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
