<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background: #222;
            user-select: none;
        }

        /*
          Sprite sheet facts (measured):
            Source image: 1280x1280px
            Grid: 5 cols x 5 rows
            Each frame: 256x256px
            All rows are the same left-facing walk cycle

          Display size: 128x128px (0.5x scale)
            background-size: 640x640px  (1280 * 0.5)
            Frame stride:    128px      (256  * 0.5)
            Animation: 0 to -640px in 5 steps
        */

        .pet {
            position: absolute;
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            cursor: pointer;
        }

        .selected { outline: 2px dashed white; z-index: 100; }

        .idle.girl {
            background-image: url('gina-idle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .idle.boy {
            background-image: url('vince-idle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .walking.girl {
            background-image: url('gina-walk.png');
            background-size: 1024px 1024px;
            background-position-y: 0px;
            background-repeat: no-repeat;
            animation: walk5 0.5s steps(5, end) infinite;
        }
        .walking.boy {
            background-image: url('vince-walk.png');
            background-size: 1024px 1024px;
            background-position-y: 0px;
            background-repeat: no-repeat;
            animation: walk5 0.5s steps(5, end) infinite;
        }

        @keyframes walk5 {
            from { background-position-x: 0px; }
            to   { background-position-x: -1024px; }
        }

        .face-right { transform: scaleX(-1); }

        #hint {
            position: fixed;
            bottom: 16px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.45);
            font: 13px/1 sans-serif;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="pet1" class="pet girl idle selected"></div>
    <div id="pet2" class="pet boy  idle"></div>
    <div id="hint">Click a pet to select · Click elsewhere to move</div>

    <script>
        const SPEED = 3;
        const HALF  = 64;

        const pets = [
            { el: document.getElementById('pet1'), pos: {x:120,y:200}, target: {x:120,y:200} },
            { el: document.getElementById('pet2'), pos: {x:380,y:200}, target: {x:380,y:200} }
        ];

        let selectedIndex = 0;

        function setSelected(i) {
            selectedIndex = i;
            pets.forEach((p, ii) => p.el.classList.toggle('selected', ii === i));
        }

        pets.forEach((p, i) => {
            p.el.addEventListener('click', e => { e.stopPropagation(); setSelected(i); });
            p.el.style.left = p.pos.x + 'px';
            p.el.style.top  = p.pos.y + 'px';
        });

        window.addEventListener('click', e => {
            const p = pets[selectedIndex];
            p.target.x = e.clientX - HALF;
            p.target.y = e.clientY - HALF;
        });

        function update() {
            for (const p of pets) {
                const dx   = p.target.x - p.pos.x;
                const dy   = p.target.y - p.pos.y;
                const dist = Math.hypot(dx, dy);

                if (dist > SPEED) {
                    p.pos.x += (dx / dist) * SPEED;
                    p.pos.y += (dy / dist) * SPEED;

                    p.el.classList.remove('idle');
                    p.el.classList.add('walking');

                    if (Math.abs(dx) >= Math.abs(dy)) {
                        p.el.classList.toggle('face-right', dx < 0);
                    }
                } else {
                    p.pos.x = p.target.x;
                    p.pos.y = p.target.y;
                    p.el.classList.remove('walking', 'face-right');
                    p.el.classList.add('idle');
                }

                p.el.style.left = p.pos.x + 'px';
                p.el.style.top  = p.pos.y + 'px';
            }
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
