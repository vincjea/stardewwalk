        /*
          Sprite sheet: 1280x1280, 5x5 grid, frame=256px
          Display at 128px box, zoom 0.65x:
            background-size: 832px
            frame displayed: ~166px
            offset: 19px to center
        */
        .pet {
            position: absolute;
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            cursor: pointer;
            overflow: hidden;
        }

        .selected { outline: 2px dashed white; z-index: 100; }

        .idle.girl {
            background-image: url('gina-idle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .idle.boy {
            background-image: url('vince-idle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .walking.girl {
            background-image: url('gina-walk.png');
            background-size: 832px 832px;
            background-position-y: -19px;
            background-repeat: no-repeat;
            animation: walk5 0.5s steps(5, end) infinite;
        }
        .walking.boy {
            background-image: url('vince-walk.png');
            background-size: 832px 832px;
            background-position-y: -19px;
            background-repeat: no-repeat;
            animation: walk5 0.5s steps(5, end) infinite;
        }
        @keyframes walk5 {
            from { background-position-x: -19px; }
            to   { background-position-x: -851px; }
        }
        .face-right { transform: scaleX(-1); }

        /* Debug hitbox overlay */
        .hitbox {
            position: absolute;
            box-sizing: border-box;
            pointer-events: none;
            border: 2px dashed rgba(255,80,80,0.7);
            background: rgba(255,80,80,0.08);
            display: none;
        }
        .hitbox.show { display: block; }

        #hint {
            position: fixed;
            bottom: 16px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.45);
            font: 13px/1 sans-serif;
            pointer-events: none;
            white-space: nowrap;
        }
        #debug-btn {
            position: fixed;
            top: 12px; right: 12px;
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px;
            font: 12px/1 sans-serif;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="scene">
        <!-- Hitboxes — positions scaled to 728px scene (source coords * 728/1040 = * 0.7) -->
        <div class="hitbox" style="left:38px;  top:189px; width:126px; height:476px;" data-name="left_wall"></div>
        <div class="hitbox" style="left:38px;  top:189px; width:301px; height:21px;"  data-name="back_wall_L"></div>
        <div class="hitbox" style="left:343px; top:91px;  width:343px; height:21px;"  data-name="back_wall_R"></div>
        <div class="hitbox" style="left:140px; top:301px; width:266px; height:161px;" data-name="bed"></div>
        <div class="hitbox" style="left:343px; top:329px; width:98px;  height:112px;" data-name="nightstand"></div>
        <div class="hitbox" style="left:476px; top:245px; width:140px; height:266px;" data-name="bookshelf"></div>
        <div class="hitbox" style="left:231px; top:518px; width:182px; height:112px;" data-name="round_table"></div>
        <div class="hitbox" style="left:301px; top:203px; width:140px; height:112px;" data-name="shelf_wall"></div>
    </div>

    <div id="pet1" class="pet girl idle selected"></div>
    <div id="pet2" class="pet boy  idle"></div>
    <div id="hint">Click a pet to select · Click anywhere to move</div>
    <button id="debug-btn">show hitboxes</button>

    <script>
        const SPEED  = 3;
        const HALF   = 64;
        const PET_R  = 20; // collision radius from pet center

        // Scene offset (center of viewport)
        function sceneRect() {
            return document.getElementById('scene').getBoundingClientRect();
        }

        // Hitboxes in scene-local px (matching the divs above)
        const HITBOXES = [
            {x:38,  y:189, w:126, h:476}, // left wall
            {x:38,  y:189, w:301, h:21},  // back wall L
            {x:343, y:91,  w:343, h:21},  // back wall R
            {x:140, y:301, w:266, h:161}, // bed
            {x:343, y:329, w:98,  h:112}, // nightstand
            {x:476, y:245, w:140, h:266}, // bookshelf
            {x:231, y:518, w:182, h:112}, // round table
            {x:301, y:203, w:140, h:112}, // shelf wall
        ];

        function collidesWithAny(cx, cy) {
            const sr = sceneRect();
            // convert viewport coords to scene-local
            const lx = cx - sr.left;
            const ly = cy - sr.top;
            for (const h of HITBOXES) {
                if (lx + PET_R > h.x && lx - PET_R < h.x + h.w &&
                    ly + PET_R > h.y && ly - PET_R < h.y + h.h) {
                    return true;
                }
            }
            return false;
        }

        const pets = [
            { el: document.getElementById('pet1'), pos: {x:300,y:400}, target: {x:300,y:400} },
            { el: document.getElementById('pet2'), pos: {x:450,y:420}, target: {x:450,y:420} }
        ];

        let selectedIndex = 0;

        function setSelected(i) {
            selectedIndex = i;
            pets.forEach((p, ii) => p.el.classList.toggle('selected', ii === i));
        }

        pets.forEach((p, i) => {
            p.el.addEventListener('click', e => { e.stopPropagation(); setSelected(i); });
            p.el.style.left = p.pos.x + 'px';
            p.el.style.top  = p.pos.y + 'px';
        });

        window.addEventListener('click', e => {
            if (e.target.id === 'debug-btn') return;
            const cx = e.clientX - HALF;
            const cy = e.clientY - HALF;
            // Only set target if destination isn't inside a hitbox
            if (!collidesWithAny(cx + HALF, cy + HALF)) {
                const p = pets[selectedIndex];
                p.target.x = cx;
                p.target.y = cy;
            }
        });

        document.getElementById('debug-btn').addEventListener('click', e => {
            e.stopPropagation();
            const boxes = document.querySelectorAll('.hitbox');
            const showing = boxes[0].classList.contains('show');
            boxes.forEach(b => b.classList.toggle('show', !showing));
            e.target.textContent = showing ? 'show hitboxes' : 'hide hitboxes';
        });

        function update() {
            for (const p of pets) {
                const dx   = p.target.x - p.pos.x;
                const dy   = p.target.y - p.pos.y;
                const dist = Math.hypot(dx, dy);

                if (dist > SPEED) {
                    const nx = p.pos.x + (dx / dist) * SPEED;
                    const ny = p.pos.y + (dy / dist) * SPEED;
                    const cx = nx + HALF;
                    const cy = ny + HALF;

                    if (!collidesWithAny(cx, cy)) {
                        p.pos.x = nx;
                        p.pos.y = ny;
                    } else {
                        // Try sliding along X only
                        if (!collidesWithAny(cx, p.pos.y + HALF)) {
                            p.pos.x = nx;
                        }
                        // Try sliding along Y only
                        else if (!collidesWithAny(p.pos.x + HALF, cy)) {
                            p.pos.y = ny;
                        } else {
                            p.target.x = p.pos.x;
                            p.target.y = p.pos.y;
                        }
                    }

                    p.el.classList.remove('idle');
                    p.el.classList.add('walking');
                    if (Math.abs(dx) >= Math.abs(dy)) {
                        p.el.classList.toggle('face-right', dx < 0);
                    }
                } else {
                    p.pos.x = p.target.x;
                    p.pos.y = p.target.y;
                    p.el.classList.remove('walking', 'face-right');
                    p.el.classList.add('idle');
                }

                p.el.style.left = p.pos.x + 'px';
                p.el.style.top  = p.pos.y + 'px';
            }
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
