<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #333; 
        }

        .pet-style {
            position: absolute;
            /* Size of ONE frame in your grid */
            width: 256px;  
            height: 256px;
            image-rendering: pixelated;
            /* Scale down so they aren't giant on screen */
            transform: scale(0.5); 
            transform-origin: top left;
            cursor: pointer;
            background-repeat: no-repeat;
        }

        /* Sprite Sheet Setup (1024px total / 4 frames) */
        .girl { background-image: url('gina-walk.jpg'); background-size: 1024px 1024px; }
        .boy  { background-image: url('vince-walk.jpg'); background-size: 1024px 1024px; }

        /* Idle State */
        .idle.girl { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_1.jpg'); background-size: contain; background-position: center; }
        .idle.boy  { background-image: url('Gemini_Generated_Image_mk68p7mk68p7mk68_2.jpg'); background-size: contain; background-position: center; }

        .selected { filter: drop-shadow(0 0 10px #fff); z-index: 100; }

        /* WALKING ANIMATION FIX */
        /* We move the background -1024px (the whole width) in 4 distinct steps */
        .walking { animation: walk-cycle 0.7s steps(4) infinite; }
        
        @keyframes walk-cycle { 
            from { background-position-x: 0px; } 
            to { background-position-x: -1024px; } 
        }

        /* DIRECTIONAL ROWS (Calculated in 256px increments) */
        .face-down  { background-position-y: 0px; }      /* Row 1 */
        .face-left  { background-position-y: -256px; }   /* Row 2 */
        .face-up    { background-position-y: -512px; }   /* Row 3 */
        .face-right { background-position-y: -768px; }   /* Row 4 */
    </style>
</head>
<body>
    <div id="pet1" class="pet-style girl face-down selected idle"></div>
    <div id="pet2" class="pet-style boy face-down idle"></div>

    <script>
        const walkSpeed = 4;
        const petRadius = 60;
        let selectedIndex = 0;

        const pets = [
            { el: document.getElementById('pet1'), pos: { x: 100, y: 150 }, target: { x: 100, y: 150 } },
            { el: document.getElementById('pet2'), pos: { x: 400, y: 150 }, target: { x: 400, y: 150 } }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                selectedIndex = (selectedIndex === 0) ? 1 : 0;
                pets.forEach((p, i) => i === selectedIndex ? p.el.classList.add('selected') : p.el.classList.remove('selected'));
            }
        });

        window.addEventListener('click', (e) => {
            const activePet = pets[selectedIndex];
            activePet.target.x = e.clientX - 64; // Centering the click
            activePet.target.y = e.clientY - 64;
        });

        function update() {
            pets.forEach(p => {
                const dx = p.target.x - p.pos.x;
                const dy = p.target.y - p.pos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > walkSpeed) {
                    p.el.classList.remove('idle');
                    p.el.classList.add('walking');
                    
                    // Update Direction
                    p.el.classList.remove('face-up', 'face-down', 'face-left', 'face-right');
                    if (Math.abs(dx) > Math.abs(dy)) {
                        p.el.classList.add(dx > 0 ? 'face-right' : 'face-left');
                    } else {
                        p.el.classList.add(dy > 0 ? 'face-down' : 'face-up');
                    }

                    p.pos.x += (dx / distance) * walkSpeed;
                    p.pos.y += (dy / distance) * walkSpeed;
                } else {
                    p.el.classList.remove('walking');
                    p.el.classList.add('idle');
                }

                p.el.style.left = p.pos.x + "px";
                p.el.style.top = p.pos.y + "px";
            });

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
